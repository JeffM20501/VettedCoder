name: Frontend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect frontend directory
        id: check-frontend
        run: |
          if [ -f client/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Frontend directory found."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend not created yet"
          fi

      - name: Setup pnpm
        if: steps.check-frontend.outputs.exists == 'true'
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          package_json_file: client/package.json

      - name: Setup Node
        if: steps.check-frontend.outputs.exists == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: client
        run: pnpm lint

      - name: Run TypeScript type check
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: client
        run: pnpm exec tsc --noEmit

      - name: Run unit tests
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: client
        run: |
          if node -e 'const pkg = require("./package.json"); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)'; then
            pnpm test
          else
            echo "No test script found in package.json; skipping tests."
          fi

      - name: Build Next.js
        if: steps.check-frontend.outputs.exists == 'true'
        working-directory: client
        run: pnpm build

      - name: Dependency audit (informational)
        if: steps.check-frontend.outputs.exists == 'true'
        continue-on-error: true
        working-directory: client
        run: pnpm audit --audit-level=high
